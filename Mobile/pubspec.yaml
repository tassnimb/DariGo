
name: mobile
description: "DariGo Flutter App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.3
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: 2.5.5

  # Google Maps et géolocalisation
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1

  # Messagerie en temps réel
  web_socket_channel: ^3.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
